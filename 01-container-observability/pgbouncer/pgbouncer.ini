[databases]
postgres = host=db-psqlflex-homelab.postgres.database.azure.com port=5432 dbname=postgres user=id-postgres-auth

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 100
default_pool_size = 10
admin_users = admin
server_tls_sslmode = require